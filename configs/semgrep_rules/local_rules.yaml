rules:
  - id: python-sqlite-injection
    patterns:
      - pattern-either:
          - pattern: $CONN.execute("..." + $VAR, ...)
          - pattern: $CONN.execute(f"...", ...)
          - pattern: |
              $QUERY = "..." + $VAR
              ...
              $CONN.execute($QUERY, ...)
          - pattern: |
              $QUERY = f"..."
              ...
              $CONN.execute($QUERY, ...)
    message: Potential SQL injection detected. Use parameterized queries instead.
    languages: [python]
    severity: ERROR
  - id: python-flask-debug-true
    pattern: $APP.run(..., debug=True, ...)
    message: Flask app running with debug=True. This is insecure for production.
    languages: [python]
    severity: WARNING
  - id: generic-hardcoded-secret
    pattern: $SECRET = "..."
    message: Potential hardcoded secret detected.
    languages: [python, javascript, java]
    severity: WARNING
  - id: python-pickle-load
    pattern: pickle.loads(...)
    message: Unsafe deserialization with pickle detected.
    languages: [python]
    severity: ERROR
  - id: python-os-system
    pattern: os.system(...)
    message: Potential command injection via os.system.
    languages: [python]
    severity: WARNING
