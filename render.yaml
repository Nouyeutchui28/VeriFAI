services:
  - type: web
    name: verifai-llm
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./verifai_llm.db
      - key: STREAMLIT_SERVER_PORT
        value: "10000"
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    autoDeploy: true
