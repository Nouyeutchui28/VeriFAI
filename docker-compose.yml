version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: verifai_llm_db
    environment:
      POSTGRES_USER: verifai_llm
      POSTGRES_PASSWORD: verifai_llm_password
      POSTGRES_DB: verifai_llm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifai_llm"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: verifai_llm_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
